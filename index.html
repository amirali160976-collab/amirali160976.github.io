<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meryland Roleplay</title>
    <style>
        :root { --bg-color: #050a0f; --accent-blue: #0077be; --accent-jade: #00a86b; --text-white: #e0e0e0; }
        body { margin: 0; background-color: var(--bg-color); color: var(--text-white); font-family: 'Segoe UI', Tahoma, sans-serif; overflow-x: hidden; }
        
        /* منو */
        .menu-icon { position: fixed; top: 25px; right: 25px; z-index: 1000; cursor: pointer; }
        .menu-icon div { width: 28px; height: 3px; background-color: var(--accent-jade); margin: 5px 0; }
        .side-menu { position: fixed; top: 0; right: -300px; width: 260px; height: 100%; background: linear-gradient(180deg, #0a192f 0%, #002b24 100%); transition: 0.4s; z-index: 999; padding-top: 100px; }
        .side-menu.open { right: 0; }
        .side-menu a { display: block; padding: 20px 30px; color: #fff; text-decoration: none; font-size: 1.2rem; cursor: pointer; transition: 0.3s; }
        .side-menu a:hover { color: var(--accent-jade); }

        /* لوگوی حرفه‌ای با SVG */
        .logo-container { text-align: center; margin-top: 50px; margin-bottom: 20px; }
        .logo-svg { width: 120px; height: 120px; fill: var(--accent-jade); filter: drop-shadow(0 0 10px var(--accent-jade)); margin-bottom: 15px; }
        .logo-text { font-size: 3rem; font-weight: 900; letter-spacing: 3px; color: #fff; text-transform: uppercase; text-shadow: 0 0 15px rgba(0, 168, 107, 0.5); }
        .logo-sub { font-size: 0.9rem; color: var(--accent-blue); letter-spacing: 8px; text-transform: uppercase; }

        /* صفحات */
        .page { display: none; padding: 100px 20px; text-align: center; animation: fadeIn 0.8s; min-height: 60vh; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .about-text { max-width: 800px; margin: 0 auto; line-height: 1.8; color: #b0b0b0; font-size: 1.1rem; }
        .highlight { color: var(--accent-jade); font-weight: bold; }

        /* فروشگاه */
        .maintenance-box { max-width: 500px; margin: 50px auto; padding: 60px 30px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(0, 168, 107, 0.2); border-radius: 30px; backdrop-filter: blur(10px); }
        .loading-bar-container { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; margin: 30px 0; }
        .loading-bar-fill { width: 99%; height: 100%; background: linear-gradient(to right, var(--accent-blue), var(--accent-jade)); border-radius: 10px; }
        
        .btn { display: inline-block; padding: 15px 40px; background: transparent; border: 2px solid var(--accent-jade); color: var(--accent-jade); text-decoration: none; border-radius: 5px; font-weight: bold; transition: 0.3s; margin-top: 20px; cursor: pointer; }
        .btn:hover { background: var(--accent-jade); color: white; }
    </style>
</head>
<body>

    <div class="menu-icon" onclick="document.getElementById('sideMenu').classList.toggle('open')">
        <div></div><div></div><div></div>
    </div>
    
    <div class="side-menu" id="sideMenu">
        <a onclick="showPage('home')">🏠 خانه</a>
        <a onclick="showPage('store')">🛒 فروشگاه</a>
        <a href="https://rubika.ir/MeryLandRolePlay" target="_blank">💬 کانال روبیکا</a>
    </div>

    <!-- صفحه خانه با لوگوی عقاب -->
    <div id="home" class="page active">
        <div class="logo-container">
            <!-- نماد عقاب (SVG) -->
            <svg class="logo-svg" viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.5 3.8 10.7 9 12 5.2-1.3 9-6.5 9-12V5l-9-4z"/></svg>
            <div class="logo-text">MERYLAND</div>
            <div class="logo-sub">ROLEPLAY SERVER</div>
        </div>
        
        <div class="about-text">
            <p>
                در <span class="highlight">مریلند رول‌پلی</span>، قوانین برای همه یکسان است.
                ما محیطی را برای شما آماده کرده‌ایم که در آن داستان‌ها ساخته می‌شوند و قدرت در دستان شماست.
            </p>
            <button class="btn" onclick="showPage('store')">ورود به سرور</button>
        </div>
    </div>

    <!-- صفحه فروشگاه -->
    <div id="store" class="page">
        <div class="maintenance-box">
            <h2>وضعیت فروشگاه</h2>
            <div class="loading-bar-container"><div class="loading-bar-fill"></div></div>
            <p>فروشگاه در حال بروزرسانی توسط تیم فنی...</p>
        </div>
    </div>

    <script>
        function showPage(pageId) {
            document.getElementById('sideMenu').classList.remove('open');
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
